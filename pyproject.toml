[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promptbench-studio"
version = "0.1.0"
description = "Open-source multi-provider LLM benchmark studio"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "PromptBench Studio contributors" }]
dependencies = [
  "aiosqlite>=0.21,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.25,<5",
  "litellm>=1.80.13,<1.92",
  "pandas>=2.3,<4",
  "plotly>=6.3,<7",
  "pydantic>=2.12,<3",
  "regex>=2026.7.10,<2027",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "streamlit>=1.59,<2",
  "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-regex>=2026.1.0.20260423,<2027",
]

[project.scripts]
promptbench-studio = "promptbench_studio.ui.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/promptbench_studio"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["promptbench_studio"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/promptbench_studio"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
